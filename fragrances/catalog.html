<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fragrance Collection</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f0f;color:#e0e0e0;padding:12px;min-height:100vh}
h1{font-size:1.4rem;color:#fff;margin-bottom:2px;text-align:center}
@media(min-width:769px){body{padding:24px;max-width:960px;margin:0 auto}h1{text-align:left}}

.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{flex:1;padding:12px 10px;border:1px solid #333;background:#1a1a1a;color:#aaa;border-radius:12px;font-size:.82rem;cursor:pointer;text-align:center;font-weight:600;min-width:0;transition:all .15s}
.tab:active{opacity:.7}
.tab.active{background:#6366f1;border-color:#6366f1;color:#fff}

.section-title{font-size:1rem;font-weight:600;color:#fff;margin-bottom:8px}
.subtitle{color:#888;font-size:.75rem;margin-bottom:12px}

/* A-Z */
.alpha-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px;justify-content:center}
.alpha-btn{width:30px;height:30px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#aaa;font-size:.72rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.alpha-btn:active{opacity:.7}
.alpha-btn.active{background:#6366f1;border-color:#6366f1;color:#fff}
.alpha-btn.empty{opacity:.15;cursor:default}

/* Brand grid */
.brand-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
@media(min-width:769px){.brand-grid{grid-template-columns:1fr 1fr 1fr}}
.brand-card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s}
.brand-card:active{opacity:.7}
.brand-card .bn{font-weight:600;color:#fff;font-size:.82rem}
.brand-card .bc{color:#6366f1;font-size:.7rem;margin-top:2px}
.brand-card.active{background:#1e1b4b;border-color:#3730a3}

/* Mood cards */
.mood-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
@media(min-width:769px){.mood-grid{grid-template-columns:1fr 1fr 1fr}}
.mood-card{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:16px;cursor:pointer;transition:all .15s}
.mood-card:active{opacity:.7}
.mood-card.active{background:#1e1b4b;border-color:#3730a3}
.mood-card .me{font-size:1.6rem;margin-bottom:4px}
.mood-card .mt{font-weight:600;color:#fff;font-size:.88rem;margin-bottom:4px}
.mood-card .md{color:#888;font-size:.7rem;line-height:1.4}
.mood-card .mc{color:#6366f1;font-size:.68rem;margin-top:4px}

/* Fragrance cards */
.frag-grid{display:grid;gap:8px;margin-bottom:12px}
.frag-card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px 12px}
.fc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.fcn{font-weight:600;color:#fff;font-size:.85rem}
.fcb{color:#818cf8;font-size:.75rem}
.fc-meta{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
.fc-type{font-size:.65rem;padding:1px 6px;border-radius:3px;font-weight:600}
.tx{background:#1e3a5f;color:#93c5fd}
.te{background:#2a1a3a;color:#e9d5ff}
.tt{background:#1a3a2a;color:#86efac}
.to{background:#2a1a1a;color:#fca5a5}
.fc-season{font-size:.65rem;padding:1px 6px;background:#222;color:#888;border-radius:3px}
.fc-vibe{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.vp{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.6rem;font-weight:600}
.vcalm{background:#0a2e1a;color:#6ee7b7}
.vhappy{background:#1a2e0a;color:#fde68a}
.vbold{background:#2e0a0a;color:#fca5a5}
.vromantic{background:#2e0a1a;color:#f9a8d4}
.vcozy{background:#1a1a0a;color:#fcd34d}
.fc-notes{margin-top:4px}
.fc-lay{margin-top:8px;width:100%;padding:7px;background:#1e1b4b;border:1px solid #3730a3;border-radius:6px;color:#a5b4fc;font-size:.72rem;font-weight:600;cursor:pointer}
.fc-lay:hover{background:#2a2563;color:#fff}
.fc-lay:active{opacity:.7}
.fc-nl{font-size:.7rem;color:#aaa;display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.fc-nl .nl{color:#666;min-width:28px;font-size:.6rem;text-transform:uppercase;flex-shrink:0}

/* Layer */
.pair-section{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.pair-label{color:#888;font-size:.75rem;white-space:nowrap}
.ac-wrap{position:relative;flex:1;min-width:140px}
.ac-wrap input{width:100%;padding:8px 10px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff;font-size:.8rem;outline:none}
.ac-wrap input:focus{border-color:#6366f1}
.ac-drop{position:absolute;top:100%;left:0;right:0;background:#1a1a1a;border:1px solid #444;border-top:none;border-radius:0 0 8px 8px;max-height:220px;overflow-y:auto;z-index:100;display:none}
.ac-item{padding:7px 10px;cursor:pointer;font-size:.78rem;color:#ccc;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:#2a2a2a;color:#fff}
.ac-item .ac-brand{color:#818cf8;font-size:.68rem}
.ac-sel{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#1e1b4b;border:1px solid #3730a3;border-radius:6px;color:#a5b4fc;font-size:.8rem;margin-bottom:4px}
.ac-sel .ac-x{cursor:pointer;color:#888;font-size:1rem;padding:0 4px}
.ac-sel .ac-x:hover{color:#fca5a5}
#layerActions{display:flex;gap:6px;margin-bottom:10px}
#layerScoreBtn{flex:1;padding:10px;background:#6366f1;border:none;color:#fff;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer}
#layerScoreBtn:disabled{opacity:.4;cursor:default}
#shuffleBtn{padding:10px 12px;background:#1a1a1a;border:1px solid #333;color:#aaa;border-radius:8px;font-size:.8rem;cursor:pointer}

.score-box{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:14px;margin-top:8px}
.score-num{font-size:1.6rem;font-weight:700;margin-bottom:6px}
.s5{color:#86efac}.s4{color:#6ee7b7}.s3{color:#fde68a}.s2{color:#fca5a5}.s1{color:#fca5a5}
.score-br{margin-top:10px;padding-top:10px;border-top:1px solid #333}
.br-row{display:flex;justify-content:space-between;padding:3px 0;font-size:.72rem}
.br-l{color:#888}.br-v{color:#ccc;font-weight:600}
.br-bar{height:4px;border-radius:2px;background:#333;margin:2px 0 6px;overflow:hidden}
.br-f{height:100%;border-radius:2px;transition:width .3s}
.why{font-size:.72rem;line-height:1.5;margin-top:10px;padding:8px 12px;border-radius:8px}
.why-works{background:#0a1e0a;border:1px solid #1a4a1a;color:#86efac}
.why-not{background:#1e0a0a;border:1px solid #4a1a1a;color:#fca5a5}
.why b{display:block;margin-bottom:3px}

.back-btn{padding:6px 14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#aaa;font-size:.78rem;cursor:pointer;margin-bottom:10px;display:inline-block}
.back-btn:hover{border-color:#6366f1;color:#fff}

/* Search */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;padding:10px 14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:.85rem;outline:none}
.search-wrap input:focus{border-color:#6366f1}
.search-drop{position:absolute;top:100%;left:0;right:0;background:#1a1a1a;border:1px solid #444;border-top:none;border-radius:0 0 8px 8px;max-height:240px;overflow-y:auto;z-index:100;display:none}
.search-drop .ac-item{padding:7px 10px;cursor:pointer;font-size:.78rem;color:#ccc;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.search-drop .ac-item:last-child{border-bottom:none}
.search-drop .ac-item:hover{background:#2a2a2a;color:#fff}
.search-drop .ac-item .ac-brand{color:#818cf8;font-size:.68rem}

.nr{text-align:center;padding:40px;color:#555;font-size:.85rem}
.upd{color:#555;font-size:.7rem;margin-top:12px;text-align:center}

@media(max-width:768px){
  body{padding:10px}
  .tabs{gap:4px}
  .tab{font-size:.75rem;padding:10px 6px}
  .brand-grid{grid-template-columns:1fr 1fr}
  .mood-grid{grid-template-columns:1fr}
  .pair-section{flex-direction:column}
  .ac-wrap{min-width:100%}
}
</style></head><body>

function renderCard(f){

  h+='<span class="fc-type '+tc+'">'+ty+'</span>';
  if(f.season&&f.season.length)f.season.forEach(function(s){h+='<span class="fc-season">'+s+'</span>'});
  h+='</div>';
  if(f.moods&&f.moods.length){

    else if(f.top&&f.top.length)h+='<div class="fc-nl"><span class="nl">top</span>'+f.top.join(', ')+'</div>';
    if(f.heartNotes&&f.heartNotes.length)h+='<div class="fc-nl"><span class="nl">heart</span>'+f.heartNotes.join(', ')+'</div>';
    else if(f.middle&&f.middle.length)h+='<div class="fc-nl"><span class="nl">heart</span>'+f.middle.join(', ')+'</div>';
    if(f.baseNotes&&f.baseNotes.length)h+='<div class="fc-nl"><span class="nl">base</span>'+f.baseNotes.join(', ')+'</div>';

    h+='</div>';

function acSearch(side){

function shufflePair(){
  var a,b,i,j,stars;
  for(var tries=0;tries<500;tries++){
    i=Math.floor(Math.random()*fragArr.length);
    do{j=Math.floor(Math.random()*fragArr.length)}while(j===i);
    a=fragArr[i];b=fragArr[j];
    // Quick score calc
    var aNts=(a.topNotes||[]).concat(a.heartNotes||[]).concat(a.baseNotes||[]).concat(a.top||[]).concat(a.middle||[]).concat(a.base||[]);
    var bNts=(b.topNotes||[]).concat(b.heartNotes||[]).concat(b.baseNotes||[]).concat(b.top||[]).concat(b.middle||[]).concat(b.base||[]);
    var shared=0;aNts.forEach(function(n){if(bNts.some(function(bn){return bn.toLowerCase()===n.toLowerCase()}))shared++});
    var aSP=(a.scentProfile||[]).map(function(s){return s.toLowerCase()}),bSP=(b.scentProfile||[]).map(function(s){return s.toLowerCase()});
    var spShared=aSP.filter(function(s){return bSP.indexOf(s)!==-1}).length;
    var spScore=spShared/Math.max(aSP.length,bSP.length,1);
    var aSe=(a.season||[]).map(function(s){return s.toLowerCase()}),bSe=(b.season||[]).map(function(s){return s.toLowerCase()});
    var seShared=aSe.filter(function(s){return bSe.indexOf(s)!==-1}).length;
    var seScore=seShared/Math.max(aSe.length,bSe.length,1);
    var noteScore=shared>0?(shared>=3?1:shared>=2?0.8:0.5):0.3;
    var s=(noteScore*4+spScore*3+seScore*3)/10;
    stars=Math.max(1,Math.round(s*5));
    if(stars>=4){selectFrag('A',a._key);selectFrag('B',b._key);scorePair();return}
  }
  // Fallback: best pair found
  selectFrag('A',fragArr[0]._key);selectFrag('B',fragArr[1]._key);scorePair();
}

function scorePair(){
  if(!selA||!selB)return;var a=frags[selA],b=frags[selB];
  var allA=(a.topNotes||[]).concat(a.heartNotes||[]).concat(a.baseNotes||[]).concat(a.top||[]).concat(a.middle||[]).concat(a.base||[]).join(' ').toLowerCase();
  var allB=(b.topNotes||[]).concat(b.heartNotes||[]).concat(b.baseNotes||[]).concat(b.top||[]).concat(b.middle||[]).concat(b.base||[]).join(' ').toLowerCase();
  // Count shared notes
  var shared=0, aNts=(a.topNotes||[]).concat(a.heartNotes||[]).concat(a.baseNotes||[]).concat(a.top||[]).concat(a.middle||[]).concat(a.base||[]);
  var bNts=(b.topNotes||[]).concat(b.heartNotes||[]).concat(b.baseNotes||[]).concat(b.top||[]).concat(b.middle||[]).concat(b.base||[]);
  aNts.forEach(function(n){if(bNts.some(function(bn){return bn.toLowerCase()===n.toLowerCase()}))shared++});
  // Profile match
  var aSP=(a.scentProfile||[]).map(function(s){return s.toLowerCase()}),bSP=(b.scentProfile||[]).map(function(s){return s.toLowerCase()});
  var spShared=aSP.filter(function(s){return bSP.indexOf(s)!==-1}).length;
  var spTotal=Math.max(aSP.length,bSP.length)||1;
  var spScore=spShared/spTotal;
  // Season overlap
  var aSe=(a.season||[]).map(function(s){return s.toLowerCase()}),bSe=(b.season||[]).map(function(s){return s.toLowerCase()});
  var seShared=aSe.filter(function(s){return bSe.indexOf(s)!==-1}).length;
  var seTotal=Math.max(aSe.length,bSe.length)||1;
  var seScore=seShared/seTotal;
  // Note balance: complementary vs clash
  var noteScore=shared>0?(shared>=3?1:shared>=2?0.8:0.5):0.3;
  // Overall
  var s=(noteScore*4+spScore*3+seScore*3)/10;
  var rating=Math.round(((s*4)+1)*10)/10;
  var stars=Math.max(1,Math.round(s*5));
  
  var sc=stars<=2?'s2':stars<=3?'s3':stars<=4?'s4':'s5';
  var h='<div class="score-box"><div class="score-num '+sc+'">'+stars+'/5 — '+rating+'</div>';
  
  // Breakdown
  h+='<div class="score-br">';
  ['Note Match','Scent Profile','Season Match'].forEach(function(l,i){
    var v=[noteScore,spScore,seScore][i],pct=v*100,pctStr=Math.round(pct)+'%',col=pct>=70?'#86efac':pct>=40?'#fde68a':'#fca5a5';
    h+='<div class="br-row"><span class="br-l">'+l+'</span><span class="br-v" style="color:'+col+'">'+pctStr+'</span></div><div class="br-bar"><div class="br-f" style="width:'+pctStr+';background:'+col+'"></div></div>';
  });
  h+='</div>';
  
  // Why

    h+='<div class="why why-works"><b>✅ Why this works</b>';
    var reasons=[];
    if(noteScore>=0.8)reasons.push('Strong note overlap — they share key ingredients and will blend seamlessly');
    else if(noteScore>=0.5)reasons.push('Complementary notes — different enough to create depth, similar enough to harmonize');
    if(spScore>=0.8)reasons.push('Shared scent profile — they both lean '+aSP.filter(function(s){return bSP.indexOf(s)!==-1}).slice(0,2).join(', ')+', same family');
    if(seScore>=0.8)reasons.push('Same season pair — both designed for '+aSe.filter(function(s){return bSe.indexOf(s)!==-1}).join(' & '));
    if(!reasons.length)reasons.push('Good overall compatibility across multiple dimensions');
    h+=reasons.map(function(r){return'<div>• '+r+'</div>'}).join('');h+='</div>';
  }else if(stars<=2){
    h+='<div class="why why-not"><b>⚠️ Why this might not work</b>';
    var issues=[];
    if(noteScore<0.5)issues.push('Few shared notes — the scent profiles might clash rather than harmonize');
    if(spScore<0.5)issues.push('Different scent families — one is '+aSP.slice(0,2).join('/')+', the other is '+bSP.slice(0,2).join('/'));
    if(seScore<0.5)issues.push('Different season profiles — one is '+aSe.join('/')+', the other is '+bSe.join('/'));
    if(!issues.length)issues.push('Lower compatibility — try both on skin to be sure');
    h+=issues.map(function(r){return'<div>• '+r+'</div>'}).join('');h+='</div>';
  }else{
    h+='<div class="why why-works"><b>🤝 Mixed pair</b><div>• Solid match in some areas, less in others — worth a skin test</div>';
    if(noteScore>=0.6)h+='<div>• Decent note overlap — they share some DNA</div>';else h+='<div>• Few shared notes but other dimensions align</div>';
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('layerResult').innerHTML=h;
  document.getElementById('layerResult').scrollIntoView({behavior:'smooth'});
}

// Search
function acSearchMain(){
  var q=(document.getElementById('mainSearch').value||'').trim().toLowerCase(),
    drop=document.getElementById('searchDrop');
  if(!q){drop.style.display='none';drop.innerHTML='';document.getElementById('searchResults').innerHTML='';return}
  var hits=fragArr.filter(function(f){return f.name.toLowerCase().indexOf(q)!==-1||f.brand.toLowerCase().indexOf(q)!==-1}).slice(0,10);
  if(!hits.length){drop.style.display='none';drop.innerHTML='';return}
  drop.innerHTML=hits.map(function(f){return'<div class="ac-item" onmousedown="showSearchResult(\''+f._key+'\')"><span>'+f.name+'</span><span class="ac-brand">'+f.brand+'</span></div>'}).join('');
  drop.style.display='block';
}
function showSearchResult(key){
  document.getElementById('searchDrop').style.display='none';
  document.getElementById('mainSearch').value='';
  var f=frags[key];showFragCards('searchResults',[f],'search',f.name+' — '+f.brand);
  // Clear active tabs
  document.querySelectorAll('.tab').forEach(function(e){e.classList.remove('active')});
  document.querySelectorAll('.tab-content').forEach(function(e){e.style.display='none'});
}
function findLayer(key){
  switchTab('layer');
  clearFrag('B');
  selectFrag('A',key);
  document.getElementById('tab-layer').scrollIntoView({behavior:'smooth'});
}
// Init
switchTab('brand');
</script></body></html>
